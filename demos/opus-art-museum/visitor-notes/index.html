<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visitor Notes, Opus Art Museum</title><style>
:root{--bg:#fbfaf8;--paper:#fff;--text:#171819;--muted:#787b7e;--line:#e8e8e6;--accent:#68715b;--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif)}.page{width:min(900px,calc(100% - 36px));margin:auto}.bar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 0;border-bottom:1px solid var(--line);font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase}.bar a{color:var(--muted);text-decoration:none}.bar .active,.bar a:hover{color:var(--accent)}.links{display:flex;gap:15px;overflow:auto;white-space:nowrap}main{padding:clamp(56px,10vw,110px) 0}.eyebrow{font:10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(36px,6vw,62px);font-weight:400;line-height:.9;margin:20px 0}p{color:var(--muted);font-size:17px;line-height:1.7;max-width:600px}.note-form{margin-top:54px;background:var(--paper);border:1px solid var(--line);padding:clamp(20px,4vw,34px)}textarea{display:block;width:100%;min-height:140px;resize:vertical;border:1px solid var(--line);padding:15px;font:16px/1.6 var(--serif);color:var(--text);background:var(--bg)}button{margin-top:14px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:11px 16px;font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.notes{display:grid;gap:18px;margin-top:42px}.note{border-top:1px solid var(--line);padding-top:16px}.note time{font:9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}.note p{margin:8px 0 0;white-space:pre-wrap}
</style><link rel="stylesheet" href="../museum-subpages.css"></head><body><div class="page"><header class="bar"><a href="../">Opus Museum</a><nav class="links" aria-label="Museum pages"><a href="../">Museum</a><a href="../free-form/">Free Form</a><a class="active" href="./">Visitor Notes</a><a href="../sound-room/">Sound Room</a><a href="../rotating-exhibition/">Exhibition</a><a href="../curators-desk/">Curator</a><a href="../3d-room/">3D Room</a><a href="../prototypes.html">Prototypes</a></nav></header><main><div class="eyebrow">Leave a trace</div><h1>Visitor Notes</h1><p>Write what you noticed, what stayed with you, or what you want the next contributor to see. Notes are saved only in this browser for now. No name or account is required.</p><form class="note-form" id="noteForm"><textarea id="noteText" maxlength="800" placeholder="A few words for the room..." required></textarea><button>Add note</button></form><section class="notes" id="notes" aria-live="polite"></section></main></div><script>
const key='opus-museum-visitor-notes';const form=document.getElementById('noteForm'),text=document.getElementById('noteText'),notes=document.getElementById('notes');function read(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){notes.innerHTML=read().map(n=>'<article class="note"><time>'+new Date(n.date).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})+'</time><p>'+esc(n.text)+'</p></article>').join('')||'<p>No notes yet. You can be the first.</p>'}form.addEventListener('submit',e=>{e.preventDefault();const value=text.value.trim();if(!value)return;const all=read();all.unshift({text:value,date:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(all.slice(0,50)));text.value='';render()});render();
</script><script src="../museum-system.js"></script></body></html>
