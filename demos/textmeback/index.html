<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TextMeBack - Demo</title>
<meta name="description" content="TextMeBack - a friendly, local-first Mac app that shows who's waiting on a reply and drafts one in your voice. Static demo, fictional sample data." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#fcfbfa; --bg-soft:#f6f4f1;
    --card:#ffffff; --panel:#f8f7f5;
    --ink:#2c2b30; --ink-2:#4a4952; --muted:#83828d; --faint:#adacb5;
    --line:#f0efec; --line-2:#e7e5e1;
    --pop:#ff7a66; --pop-ink:#e8583f; --pop-soft:#fff1ed; --pop-line:#ffd9d0;
    --sun:#ffb35c; --sun-soft:#fff6e9;
    --good:#3fbf8f; --good-soft:#e9f9f2;
    --warn:#e8863f; --warn-soft:#fff3e8; --warn-line:#ffe0c4;
    --me:#ff7a66; --them:#f1efec;
    --shadow-sm:0 1px 2px rgba(40,34,28,.03), 0 2px 8px rgba(40,34,28,.04);
    --shadow-md:0 6px 20px rgba(40,34,28,.06), 0 14px 40px rgba(40,34,28,.07);
    --shadow-pop:0 10px 34px rgba(255,122,102,.16);
    --r:20px; --r-sm:14px; --r-xs:10px;
    --sans:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --round:'Nunito',var(--sans);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .app { display:flex; height:100vh; overflow:hidden; }
  ::selection { background:var(--pop-soft); color:var(--pop-ink); }
  a { color:inherit; }
  .emo { font-family:'Apple Color Emoji','Segoe UI Emoji',sans-serif; font-style:normal; line-height:1; }

  /* ---------- Sidebar ---------- */
  .side { width:246px; min-width:246px; background:var(--bg); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:24px 16px 18px; }
  .brand { display:flex; align-items:center; gap:9px; padding:4px 8px 2px; }
  .brand .bubble { width:30px; height:30px; border-radius:11px 11px 11px 4px; background:var(--pop); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 4px 10px rgba(255,122,102,.28); }
  .brand .bubble span { font-size:15px; }
  .brand .wm { font-family:var(--round); font-weight:800; font-size:19px; letter-spacing:-.01em; color:var(--ink); }
  .brand .wm b { color:var(--pop-ink); font-weight:900; }
  .side-tag { font-size:11.5px; color:var(--muted); padding:8px 9px 20px; }
  .back-link { display:inline-flex; align-items:center; gap:6px; margin:0 9px 18px; color:var(--faint); font-size:12px; font-weight:600; text-decoration:none; transition:color .14s; }
  .back-link:hover { color:var(--pop-ink); }
  .nav { display:flex; flex-direction:column; gap:3px; }
  .nav button {
    display:flex; align-items:center; gap:11px; width:100%; padding:10px 12px; border:none; background:none;
    font-family:var(--sans); font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; text-align:left;
    border-radius:var(--r-sm); transition:color .14s, background .14s;
  }
  .nav button .emo { font-size:16px; width:20px; text-align:center; flex-shrink:0; filter:grayscale(.35); transition:filter .14s; }
  .nav button .count { margin-left:auto; font-size:11px; font-weight:700; color:var(--muted); background:var(--bg-soft); padding:1px 8px; border-radius:100px; }
  .nav button:hover { color:var(--ink); background:var(--panel); }
  .nav button:hover .emo { filter:none; }
  .nav button.active { color:var(--pop-ink); background:var(--pop-soft); }
  .nav button.active .emo { filter:none; }
  .nav button.active .count { color:#fff; background:var(--pop); }
  .kbd { font-family:var(--sans); font-size:10px; font-weight:600; padding:1px 6px; border:1px solid var(--line-2); border-radius:6px; color:var(--faint); background:var(--card); }
  .side-foot { margin-top:auto; padding-top:16px; display:flex; flex-direction:column; gap:11px; }
  .cmdk { display:flex; align-items:center; gap:9px; width:100%; padding:10px 12px; border:1px solid var(--line-2); background:var(--card); color:var(--muted); font-family:var(--sans); font-size:12.5px; cursor:pointer; border-radius:var(--r-sm); transition:border-color .14s, color .14s; }
  .cmdk:hover { border-color:var(--pop-line); color:var(--ink); }
  .cmdk .kbd { margin-left:auto; }
  .status { display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted); padding:0 5px; }
  .status .ring { width:7px; height:7px; border-radius:50%; background:var(--good); box-shadow:0 0 0 3px var(--good-soft); }

  /* ---------- Main ---------- */
  .main { flex:1; overflow-y:auto; scroll-behavior:smooth; }
  .topbar { display:flex; align-items:center; gap:11px; padding:11px 28px; background:rgba(252,251,250,.86); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); font-size:12px; color:var(--muted); position:sticky; top:0; z-index:20; }
  .demo-pill { font-size:11px; font-weight:800; color:var(--pop-ink); background:var(--pop-soft); padding:4px 11px; border-radius:100px; font-family:var(--round); }
  .topbar .tb-text b { color:var(--ink-2); font-weight:700; }

  .wrap { max-width:1140px; padding:40px 44px 72px; }
  .head { margin-bottom:30px; }
  .eyebrow { font-family:var(--round); font-size:13px; font-weight:800; color:var(--pop-ink); margin-bottom:10px; display:flex; align-items:center; gap:7px; }
  .head h2 { font-family:var(--round); font-size:38px; font-weight:800; letter-spacing:-.025em; line-height:1.08; }
  .head p { color:var(--muted); margin-top:11px; font-size:14.5px; max-width:660px; }
  .head p b { color:var(--ink-2); font-weight:700; }

  .muted { color:var(--muted); } .faint { color:var(--faint); }
  .sm { font-size:12px; }
  hr { border:none; border-top:1px solid var(--line); margin:26px 0; }
  .sec-title { font-family:var(--round); font-size:13px; font-weight:800; color:var(--ink-2); margin-bottom:14px; display:flex; align-items:center; gap:7px; }

  /* ---------- Cards / tiles ---------- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-sm); }
  .stat-row { display:grid; grid-template-columns:repeat(4,1fr); gap:15px; margin-bottom:16px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-sm); padding:20px; transition:box-shadow .18s, transform .18s; }
  .tile:hover { box-shadow:var(--shadow-md); transform:translateY(-2px); }
  .tile .k { font-size:12.5px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .tile .k .emo { font-size:16px; }
  .tile .n { font-family:var(--round); font-size:44px; font-weight:900; letter-spacing:-.03em; margin-top:10px; line-height:1; }
  .tile .n.pop { color:var(--pop-ink); }
  .tile .cap { font-size:12px; color:var(--faint); margin-top:8px; }

  .dash-cols { display:grid; grid-template-columns:1.55fr 1fr; gap:16px; align-items:start; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-sm); overflow:hidden; }
  .panel + .panel { margin-top:16px; }
  .panel-h { display:flex; align-items:center; justify-content:space-between; padding:17px 20px; border-bottom:1px solid var(--line); }
  .panel-h h3 { font-family:var(--round); font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:7px; }
  .panel-h .more { font-size:12px; color:var(--pop-ink); cursor:pointer; font-weight:700; background:none; border:none; }
  .panel-h .more:hover { text-decoration:underline; }
  .lrow { display:flex; align-items:flex-start; gap:13px; padding:14px 20px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s; }
  .lrow:last-child { border-bottom:none; }
  .lrow:hover { background:var(--panel); }
  .lrow .av { width:34px; height:34px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; flex-shrink:0; }
  .lrow .lr-body { flex:1; min-width:0; }
  .lrow .lr-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .lrow .lr-name { font-weight:700; font-size:13.5px; }
  .lrow .lr-when { font-size:11px; color:var(--faint); white-space:nowrap; }
  .lrow .lr-prev { font-size:12.5px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow .lr-meta { margin-top:9px; display:flex; gap:6px; align-items:center; }
  .empty-row { padding:24px 20px; color:var(--faint); font-size:13px; }
  .kv { padding:17px 20px; }

  /* ---------- Tags ---------- */
  .tag { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 10px; border-radius:100px; background:var(--bg-soft); color:var(--muted); white-space:nowrap; }
  .tag.solid { background:var(--pop); color:#fff; }
  .tag.pop { background:var(--pop-soft); color:var(--pop-ink); }
  .tag.flag { background:var(--warn-soft); color:var(--warn); }
  .tag.good { background:var(--good-soft); color:var(--good); }
  .tag.sun { background:var(--sun-soft); color:var(--warn); }

  /* ---------- Inbox ---------- */
  .inbox { display:grid; grid-template-columns:360px 1fr; height:calc(100vh - 45px); }
  .threads { border-right:1px solid var(--line); overflow-y:auto; background:var(--bg); }
  .threads-head { padding:24px 22px 14px; position:sticky; top:0; background:var(--bg); z-index:2; border-bottom:1px solid var(--line); }
  .threads-head .eyebrow { margin-bottom:5px; }
  .threads-head h3 { font-family:var(--round); font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .search { display:flex; align-items:center; gap:9px; margin-top:14px; padding:10px 13px; background:var(--card); border:1px solid var(--line-2); border-radius:100px; }
  .search .emo { font-size:14px; opacity:.7; flex-shrink:0; }
  .search input { flex:1; border:none; outline:none; background:none; font-family:var(--sans); font-size:13px; color:var(--ink); }
  .search input::placeholder { color:var(--faint); }
  .search .kbd { flex-shrink:0; }
  .filters { display:flex; gap:7px; margin-top:13px; flex-wrap:wrap; }
  .chip { font-size:12px; font-weight:600; padding:6px 13px; border:1px solid var(--line-2); background:var(--card); border-radius:100px; cursor:pointer; color:var(--muted); font-family:var(--sans); transition:all .12s; }
  .chip:hover { border-color:var(--pop-line); color:var(--ink); }
  .chip.on { border-color:transparent; color:#fff; background:var(--pop); }
  .thread { padding:15px 22px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s; }
  .thread:hover { background:var(--panel); }
  .thread.active { background:var(--pop-soft); }
  .thread .t-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .thread .t-id { display:flex; align-items:center; gap:10px; min-width:0; }
  .thread .av { width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:#fff; flex-shrink:0; }
  .thread .name { font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .thread .when { font-size:10.5px; color:var(--faint); white-space:nowrap; flex-shrink:0; }
  .thread .prev { font-size:12.5px; color:var(--muted); margin:8px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .thread .t-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:9px; }
  .thread .t-meta { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }

  .detail { overflow-y:auto; padding:32px 44px 72px; }
  .d-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; }
  .d-head .d-id { display:flex; align-items:center; gap:14px; }
  .d-head .av { width:50px; height:50px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; color:#fff; flex-shrink:0; }
  .d-head h2 { font-family:var(--round); font-size:27px; font-weight:800; letter-spacing:-.02em; line-height:1.05; }
  .a-meta { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center; }

  .convo { display:flex; flex-direction:column; gap:8px; margin:0 0 24px; max-height:300px; overflow-y:auto; padding-right:6px; }
  .msg { max-width:74%; }
  .msg.me { align-self:flex-end; } .msg.them { align-self:flex-start; }
  .bubble { padding:10px 15px; font-size:13.5px; line-height:1.45; border-radius:20px; }
  .me .bubble { background:var(--me); color:#fff; border-bottom-right-radius:6px; }
  .them .bubble { background:var(--them); color:var(--ink); border-bottom-left-radius:6px; }
  .msg .time { font-size:10px; color:var(--faint); margin-top:5px; }
  .me .time { text-align:right; }

  .draft-label { display:flex; align-items:center; justify-content:space-between; margin:0 0 12px; }
  .draft-label .lbl { font-family:var(--round); font-size:14px; font-weight:800; color:var(--ink-2); display:flex; align-items:center; gap:7px; }
  .reason { font-size:13px; color:var(--muted); margin-bottom:14px; line-height:1.55; }
  .draft-card { background:var(--pop-soft); border:1px solid var(--pop-line); border-radius:var(--r); box-shadow:var(--shadow-pop); padding:18px 20px; animation:fadeSwap .28s ease; }
  .draft-card textarea { width:100%; border:none; outline:none; resize:vertical; min-height:70px; font-family:var(--sans); font-size:15.5px; line-height:1.6; color:var(--ink); background:none; }
  @keyframes fadeSwap { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }

  .tone-dial { margin:20px 0 4px; }
  .tone-dial-label { font-family:var(--round); font-size:13px; font-weight:800; color:var(--ink-2); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .tone-seg-group { display:inline-flex; border:1px solid var(--line-2); border-radius:100px; padding:4px; background:var(--card); gap:3px; }
  .tone-seg { font-family:var(--sans); font-size:12.5px; font-weight:700; padding:8px 17px; border:none; background:transparent; color:var(--muted); border-radius:100px; cursor:pointer; transition:background .14s, color .14s; }
  .tone-seg:hover { color:var(--ink); }
  .tone-seg.on { background:var(--pop); color:#fff; }
  .tone-seg:focus-visible { outline:2px solid var(--pop); outline-offset:2px; }
  .tone-caption { font-size:12.5px; color:var(--faint); margin-top:11px; max-width:490px; line-height:1.55; }
  .rw-label { font-family:var(--round); font-size:13px; font-weight:800; color:var(--ink-2); margin:24px 0 10px; display:flex; align-items:center; gap:7px; }
  .rewrites { display:flex; flex-wrap:wrap; gap:8px; }
  .rw { font-size:12.5px; font-weight:600; padding:7px 14px; border:1px solid var(--line-2); background:var(--card); border-radius:100px; cursor:pointer; color:var(--muted); font-family:var(--sans); transition:all .12s; }
  .rw:hover { border-color:var(--pop-line); color:var(--pop-ink); background:var(--pop-soft); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:24px; }
  .btn { font-family:var(--sans); font-size:13px; font-weight:700; padding:11px 18px; border-radius:100px; cursor:pointer; border:1px solid var(--line-2); background:var(--card); color:var(--ink); transition:all .12s; }
  .btn:hover { background:var(--panel); border-color:var(--faint); }
  .btn.primary { background:var(--pop); border-color:var(--pop); color:#fff; box-shadow:0 6px 16px rgba(255,122,102,.24); }
  .btn.primary:hover { background:var(--pop-ink); border-color:var(--pop-ink); }
  .btn.ghost { background:none; }
  .notice { background:var(--sun-soft); border:1px solid var(--warn-line); border-radius:var(--r-sm); padding:14px 16px; font-size:12.5px; color:var(--warn); margin-top:16px; line-height:1.55; }
  .notice b { color:var(--ink-2); }

  /* ---------- Follow-ups ---------- */
  .fu { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 20px; border-bottom:1px solid var(--line); }
  .fu:last-child { border-bottom:none; }
  .fu .task { font-weight:700; font-size:13.5px; }
  .fu .fu-meta { display:flex; gap:11px; margin-top:7px; flex-wrap:wrap; align-items:center; }
  .dir { font-size:11px; font-weight:700; padding:3px 10px; border-radius:100px; background:var(--bg-soft); color:var(--ink-2); }
  .conf { font-size:11px; color:var(--faint); }
  .empty { color:var(--faint); padding:60px 0; text-align:center; font-size:13.5px; }
  .empty .big { font-family:var(--round); font-size:40px; display:block; margin-bottom:10px; }

  /* ---------- Insights ---------- */
  .acard { padding:22px; margin-bottom:15px; }
  .acard .a-top { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .a-id { display:flex; align-items:center; gap:13px; }
  .acard .av { width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; flex-shrink:0; }
  .a-name { font-family:var(--round); font-weight:800; font-size:16px; letter-spacing:-.01em; }
  .a-sub { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; align-items:center; }
  .stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:18px; margin-top:20px; padding-top:18px; border-top:1px solid var(--line); }
  .stat .k { font-size:11px; font-weight:600; color:var(--faint); }
  .stat .v { font-weight:700; font-size:14.5px; margin-top:6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; font-weight:700; color:var(--faint); padding:0 14px 13px 0; }
  td { padding:14px 14px 14px 0; border-top:1px solid var(--line); }

  /* ---------- Settings ---------- */
  .ssection { margin-bottom:28px; }
  .srow { display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line); gap:24px; }
  .srow:last-child { border-bottom:none; }
  .srow .s-label { font-weight:700; font-size:13.5px; }
  .srow .s-desc { font-size:12.5px; color:var(--muted); margin-top:4px; max-width:470px; line-height:1.55; }
  .sinput { border:1px solid var(--line-2); border-radius:var(--r-sm); padding:10px 13px; font-family:var(--sans); font-size:13px; width:280px; outline:none; background:var(--card); color:var(--ink); transition:border-color .12s, box-shadow .12s; }
  .sinput:focus { border-color:var(--pop-line); box-shadow:0 0 0 3px var(--pop-soft); }
  .tog { width:44px; height:26px; border:1px solid var(--line-2); background:var(--bg-soft); border-radius:100px; position:relative; cursor:pointer; flex-shrink:0; transition:all .15s; }
  .tog::after { content:''; position:absolute; width:20px; height:20px; background:#fff; box-shadow:var(--shadow-sm); border-radius:50%; top:2px; left:2px; transition:.15s; }
  .tog.on { background:var(--pop); border-color:var(--pop); }
  .tog.on::after { left:21px; }

  /* ---------- Command palette ---------- */
  .cmd-overlay { position:fixed; inset:0; background:rgba(70,60,52,.28); backdrop-filter:blur(4px); z-index:200; display:none; align-items:flex-start; justify-content:center; padding-top:14vh; }
  .cmd-overlay.on { display:flex; animation:ovf .16s ease; }
  @keyframes ovf { from { opacity:0; } to { opacity:1; } }
  .cmd { width:min(560px,92vw); background:var(--card); border:1px solid var(--line-2); border-radius:22px; box-shadow:var(--shadow-md); overflow:hidden; animation:cmdIn .18s cubic-bezier(.2,.8,.2,1); }
  @keyframes cmdIn { from { opacity:0; transform:translateY(-8px) scale(.98); } to { opacity:1; transform:none; } }
  .cmd-search { display:flex; align-items:center; gap:11px; padding:17px 20px; border-bottom:1px solid var(--line); }
  .cmd-search .emo { font-size:17px; }
  .cmd-search input { flex:1; border:none; outline:none; background:none; font-family:var(--sans); font-size:15px; color:var(--ink); }
  .cmd-list { max-height:340px; overflow-y:auto; padding:8px; }
  .cmd-group { font-size:11px; font-weight:700; color:var(--faint); padding:11px 12px 5px; }
  .cmd-item { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; cursor:pointer; font-size:13.5px; color:var(--ink-2); }
  .cmd-item .emo { font-size:16px; width:20px; text-align:center; flex-shrink:0; }
  .cmd-item .av { width:24px; height:24px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:700; color:#fff; flex-shrink:0; }
  .cmd-item .sub { margin-left:auto; font-size:11px; color:var(--faint); }

      <span class="tag">${t.conf} confidence</span>
      <span class="tag ${t.trend==='declining'?'sun':t.trend==='improving'?'good':''}">${t.trend==='declining'?'cooling off lately':t.trend==='improving'?'warming up':'steady'}</span>
      ${t.needs?`<span class="tag pop">quiet for ${t.silence}</span>`:''}
      ${t.risk.map(f=>`<span class="tag flag">${f}</span>`).join('')}
    </div>
    <div class="convo">
      ${t.msgs.map(mm=>`<div class="msg ${mm.me?'me':'them'}"><div class="bubble">${mm.t}</div><div class="time">${tfmt(mm.at)}</div></div>`).join('')}
    </div>
    <div class="draft-label"><span class="lbl"><span class="emo">✍️</span> Here's a draft</span><span class="tag pop">${t.draft.conf} confidence</span></div>
    <div class="reason">${t.draft.reason}</div>
    <div class="draft-card"><textarea id="draft" oninput="state.drafts[${t.id}]=this.value">${dtext}</textarea></div>
    ${TONE_VARIANTS[t.id] ? toneDialHTML(t.id) : ''}
    ${highRisk?`<div class="notice"><b>Worth a careful read.</b> This one touches something sensitive (${t.risk.join(', ')}). It only ever copies to your clipboard, so nothing is sent for you.</div>`:''}
    <div class="rw-label"><span class="emo">🪄</span> Tweak it</div>
    <div class="rewrites">
      ${['shorter','warmer','more direct','less sorry','say no kindly','buy some time','ask one thing','calmer'].map(r=>`<button class="rw" onclick="rewrite(${t.id},'${r}')">${r}</button>`).join('')}
    </div>
    <div class="actions">
      <button class="btn primary" onclick="copyDraft(${t.id})">Copy it 📋</button>
      <button class="btn" onclick="toast('Saved, nice','💾')">Looks good</button>
      <button class="btn ghost" onclick="toast('Got it, we\\'ll learn your voice','🎧')">Not quite me</button>
    </div>`;
  return `<div class="inbox ${state.inboxPane==='detail'?'show-detail':'show-list'}">
    <div class="threads">
      <div class="threads-head">
        <div class="eyebrow"><span class="emo">💬</span> your inbox</div><h3>Everyone</h3>
        <div class="search">
          <span class="emo">🔍</span>
          <input placeholder="Search people or messages" value="${state.search}" oninput="setSearch(this.value)" />
          <span class="kbd">/</span>
        </div>
        <div class="filters">${filt('needs','Waiting on you')}${filt('all','Everyone')}${filt('risk','Flagged')}${filt('emotional','Tender')}</div>
      </div>
      ${threadList}
    </div>
    <div class="detail">${detail}</div>
  </div>`;
}
function toneDialHTML(id){
  const tone = state.tone[id];
  const seg=(key,label)=>`<button type="button" class="tone-seg ${tone===key?'on':''}" aria-pressed="${tone===key}" onclick="setTone(${id},'${key}')" onkeydown="toneKeyNav(event)">${label}</button>`;
  return `<div class="tone-dial">
    <div class="tone-seg-group" role="group" aria-label="Reply tone">${seg('casual','Casual')}${seg('warm','Warm')}${seg('professional','Polished')}</div>
    <p class="tone-caption">In the real app, every vibe is written in your own voice, from how you actually text. Nothing is sent for you.</p>
  </div>`;
}

// ---------- Follow-ups ----------
function viewFollowups(){
  const fu = allFollowups();
  const groups={}; fu.forEach(f=>{ (groups[f.dir]=groups[f.dir]||[]).push(f); });
  const body = Object.keys(groups).length ? Object.entries(groups).map(([dir,items])=>`
    <div class="sec-title" style="margin-top:26px">${DIR_LABEL[dir]||dir}</div>
    <div class="panel">${items.map(f=>`<div class="fu">
      <div><div class="task">${f.task}</div>
        <div class="fu-meta"><span class="dir">${DIR_LABEL[f.dir]}</span><span class="sm muted">${f.who}</span>${f.due?`<span class="sm" style="color:var(--pop-ink);font-weight:600">by ${f.due}</span>`:''}<span class="conf">${f.conf} confidence</span></div>
      </div>
      <button class="btn" onclick="complete('${f.key}')">Done ✓</button>
    </div>`).join('')}</div>`).join('') : '<div class="empty"><span class="big">🎉</span>All tied up. Nothing left to follow up on.</div>';
  return `<div class="wrap">
    <div class="head"><div class="eyebrow"><span class="emo">✅</span> loose ends</div><h2>The little things you said you'd do.</h2><p><b>${fu.length}</b> follow-ups we spotted in your chats, sorted by who owes whom.</p></div>
    ${body}
  </div>`;
}

// ---------- Insights ----------
function viewAnalytics(){
  const cards = ANALYTICS.map(a=>`
    <div class="card acard">
      <div class="a-top">
        <div class="a-id">${av(a.name,'')}
          <div><div class="a-name">${a.name}</div>
            <div class="a-sub">
              <span class="tag">${a.tone}</span>
              <span class="tag ${a.trend==='declining'?'sun':a.trend==='improving'?'good':''}">${a.trend==='declining'?'cooling off lately':a.trend==='improving'?'warming up':'steady'}</span>
              <span class="conf">${a.conf} confidence</span>
            </div>
          </div>
        </div>
        <div class="sm muted" style="text-align:right">${a.vol} texts<br/>last ${a.last}</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">You usually reply in</div><div class="v">${a.resp}</div></div>
        <div class="stat"><div class="k">Waiting on you</div><div class="v">${a.waitYou?'Yep':'Nope'}</div></div>
        <div class="stat"><div class="k">You two talk about</div><div class="v" style="font-size:12.5px">${a.topics.join(', ')}</div></div>
        ${a.loop?`<div class="stat"><div class="k">Still open</div><div class="v" style="font-size:12.5px;color:var(--pop-ink)">${a.loop}</div></div>`:''}
      </div>
    </div>`).join('');
  const tokenRows = TOKENS.map(r=>`<tr><td>${r.op}</td><td class="muted">${r.n}</td><td class="muted">${r.inp.toLocaleString()}</td><td class="muted">${r.out.toLocaleString()}</td><td style="color:var(--pop-ink);font-weight:700">$${r.cost.toFixed(4)}</td></tr>`).join('');
  return `<div class="wrap">
    <div class="head"><div class="eyebrow"><span class="emo">💡</span> gentle read</div><h2>Just a vibe, not a verdict.</h2><p>Soft reads from how you two text, never facts or psychology. Confidence shows how much there was to go on.</p></div>
    <div class="notice" style="margin-bottom:24px;background:var(--good-soft);border-color:#c9efdf;color:var(--good)"><b>These are guesses.</b> Low confidence means take it lightly. TextMeBack describes the chat ("cooling off lately"), it never judges the person. 🌱</div>
    ${cards}
    <div class="sec-title" style="margin-top:34px"><span class="emo">☕</span> Roughly what drafting cost this week</div>
    <div class="card" style="padding:22px;overflow-x:auto"><table><thead><tr><th>What it did</th><th>Times</th><th>In</th><th>Out</th><th>About</th></tr></thead><tbody>${tokenRows}</tbody></table>
    <p class="sm muted" style="margin-top:14px">Prices come from your own settings and may not match real billing. Only counts when you turn on AI drafts.</p></div>
  </div>`;
}

// ---------- Exports ----------
function viewExports(){
  return `<div class="wrap">
    <div class="head"><div class="eyebrow"><span class="emo">📤</span> take it with you</div><h2>Tidy summaries, never message dumps.</h2><p>Summaries only, never your raw texts. You press the button, it timestamps everything, and it labels the guesses.</p></div>
    <div class="dash-cols">
      <div class="card" style="padding:24px"><h3 style="font-family:var(--round);font-size:15px;font-weight:800">📝 Markdown</h3><p class="sm muted" style="margin:11px 0 20px">A daily recap, your follow-ups, and insights as tidy files on your Mac.</p><button class="btn primary" onclick="toast('Wrote 3 files (demo)','📝')">Export Markdown</button></div>
      <div class="card" style="padding:24px"><h3 style="font-family:var(--round);font-size:15px;font-weight:800">🔮 Obsidian</h3><p class="sm muted" style="margin:11px 0 20px">Drops notes into a <span style="color:var(--pop-ink)">/TextMeBack/</span> folder with tidy links.</p><button class="btn primary" onclick="toast('Set a vault path in Settings (demo)','🔮')">Send to Obsidian</button></div>
    </div>
    <div class="sec-title" style="margin-top:32px"><span class="emo">🕊️</span> Just exported</div>
    <div class="panel">
      <div class="fu"><div><span class="tag">daily recap</span> <span class="sm muted" style="margin-left:8px">~/TextMeBack/daily_2026-06-28.md</span></div><span class="sm faint">just now</span></div>
      <div class="fu"><div><span class="tag">follow-ups</span> <span class="sm muted" style="margin-left:8px">~/TextMeBack/followups_2026-06-28.md</span></div><span class="sm faint">just now</span></div>
    </div>
  </div>`;
}

// ---------- Settings ----------
function viewSettings(){
  const tog=(k)=>`<div class="tog ${toggles[k]?'on':''}" onclick="flip('${k}')" role="switch" aria-checked="${toggles[k]}"></div>`;
  return `<div class="wrap">
    <div class="head"><div class="eyebrow"><span class="emo">⚙️</span> settings</div><h2>Everything stays with you.</h2><p>Nothing leaves your Mac unless you add an API key and turn off local-only mode.</p></div>
    <div class="ssection"><div class="sec-title"><span class="emo">💬</span> Your Messages</div><div class="card">
      <div class="srow"><div><div class="s-label">Connection</div><div class="s-desc">Reads your Messages on this Mac, and only reads. Needs Full Disk Access for Terminal in macOS settings.</div></div><span class="tag">demo, not connected</span></div>
      <div class="srow"><div><div class="s-label">How many chats</div><div class="s-desc">How many recent conversations to pull in each time.</div></div><input class="sinput" value="50" style="width:90px"/></div>
      <div class="srow"><div><div class="s-label">How far back</div><div class="s-desc">How many messages to read per conversation.</div></div><input class="sinput" value="50" style="width:90px"/></div>
    </div></div>
    <div class="ssection"><div class="sec-title"><span class="emo">🔒</span> Privacy &amp; drafting</div><div class="card">
      <div class="srow"><div><div class="s-label">Local-only mode</div><div class="s-desc">When this is on, drafts are written offline and no message text ever leaves your Mac.</div></div>${tog('local')}</div>
      <div class="srow"><div><div class="s-label">Use AI drafts</div><div class="s-desc">Optional. Sends the conversation to Claude for nicer drafts. Off by default.</div></div>${tog('llm')}</div>
      <div class="srow"><div><div class="s-label">API key</div><div class="s-desc">Turned off in this public demo. The real app keeps your key on your Mac.</div></div><span class="muted sm">demo only</span></div>
      <div class="srow"><div><div class="s-label">Model</div><div class="s-desc">Smarter models for tricky replies, lighter ones for everyday drafts.</div></div><input class="sinput" value="claude-haiku-4-5" style="width:200px"/></div>
    </div></div>
    <div class="ssection"><div class="sec-title"><span class="emo">📤</span> Export</div><div class="card">
      <div class="srow"><div><div class="s-label">Obsidian vault</div><div class="s-desc">Where your <span style="color:var(--pop-ink)">/TextMeBack/</span> notes get saved.</div></div><input class="sinput" placeholder="~/Documents/MyVault"/></div>
    </div></div>
    <div class="ssection"><div class="sec-title"><span class="emo">🧹</span> Your data</div><div class="card">
      <div class="srow"><div><div class="s-label">Refresh insights</div><div class="s-desc">Recompute the gentle reads from your stored messages.</div></div><button class="btn" onclick="toast('Refreshed (demo)','🔄')">Refresh</button></div>
      <div class="srow"><div><div class="s-label">Clear everything</div><div class="s-desc">Deletes all synced messages and analysis from this Mac.</div></div><button class="btn" onclick="toast('Demo, nothing was deleted','🫧')">Clear</button></div>
    </div></div>
  </div>`;
}

// ---------- Actions ----------
function pick(id){ state.thread=id; state.inboxPane='detail'; renderMain(); }
function openThread(id){ state.tab='inbox'; state.thread=id; state.inboxPane='detail'; renderNav(); renderMain(); window.scrollTo(0,0); }
function backToList(){ state.inboxPane='list'; renderMain(); }
function setFilter(f){ state.filter=f; renderMain(); }
function setSearch(v){ state.search=v; renderMain(); const i=document.querySelector('.search input'); if(i){ i.focus(); i.setSelectionRange(v.length,v.length); } }
function flip(k){ toggles[k]=!toggles[k]; if(k==='llm'&&toggles[k]) toggles.local=false; if(k==='local'&&toggles[k]) toggles.llm=false; renderMain(); }
function complete(key){ state.completed.add(key); renderNav(); renderMain(); toast('One less thing','🎉'); }

function rewrite(id, type){
  let t = state.drafts[id]; const words=t.split(/\s+/);
  if(type==='shorter') t=words.slice(0,Math.max(4,Math.ceil(words.length/2))).join(' ');
  else if(type==='less sorry') t=t.replace(/\b(sorry|i apologize|my bad|my fault)[,]?\s*/gi,'').replace(/^./,c=>c.toUpperCase());
  else if(type==='calmer') t=t.replace(/\b(ridiculous|insane|unacceptable|crazy)\b/gi,'frustrating');
  else if(type==='say no kindly') t="Thanks for thinking of me! I can't make this one work, but I really appreciate the ask.";
  else if(type==='buy some time') t="Thanks for this! I need a little time to think it through, I'll get back to you soon.";
  else if(type==='ask one thing') t=t.replace(/[?.!]+$/,'')+'. What works best for you?';
  else if(type==='warmer') t=t.replace(/^./,c=>c.toUpperCase());
  else if(type==='more direct') t=t.replace(/^(hey|hi|so|well|um|i think|maybe)[, ]+/i,'').replace(/^./,c=>c.toUpperCase());
  state.drafts[id]=t.trim(); renderMain(); toast('Tweaked, '+type,'🪄');
}
function setTone(id, tone){
  if(!TONE_VARIANTS[id]||!TONE_VARIANTS[id][tone]) return;
  state.tone[id]=tone; state.drafts[id]=TONE_VARIANTS[id][tone]; renderMain();
  const el=document.querySelector(`.tone-seg[aria-pressed="true"]`); if(el) el.focus();
}
function toneKeyNav(e){
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return; e.preventDefault();
  const segs=Array.from(document.querySelectorAll('.tone-seg')); const i=segs.indexOf(document.activeElement);
  if(i===-1) return; let n=e.key==='ArrowRight'?i+1:i-1; if(n<0)n=segs.length-1; if(n>=segs.length)n=0; segs[n].focus();
}
function copyDraft(id){
  const text=state.drafts[id];
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast('Copied, paste away','📋')).catch(()=>toast('Copied (demo)','📋')); }
  else toast('Copied (demo)','📋');
}
function toast(msg, emo){
  const c=document.getElementById('toasts');
  const el=document.createElement('div'); el.className='toast'; el.innerHTML=`<span class="emo">${emo||'✨'}</span>${msg}`;
  c.appendChild(el); setTimeout(()=>el.remove(),2600);
}

// ---------- Command palette ----------
let cmdSel=0;
function cmdItems(){
  const q=(document.getElementById('cmdInput')?.value||'').toLowerCase();
  const secs = TABS.map(([id,label])=>({type:'section', id, label, emo:EMO[id]}));
  const threads = THREADS.map(t=>({type:'thread', id:t.id, label:t.name, sub:t.last.slice(0,30)+'...', name:t.name}));
  const acts = [
    {type:'action', id:'copy', label:'Copy the current draft', emo:'📋'},
    {type:'action', id:'export', label:'Export a daily recap', emo:'📤'},
  ];
  const all=[...secs,...threads,...acts];
  return all.filter(i=>!q||i.label.toLowerCase().includes(q)||(i.sub||'').toLowerCase().includes(q));
}
function renderCmd(){
  cmdSel=0; const items=cmdItems(); const list=document.getElementById('cmdList');
  if(!items.length){ list.innerHTML='<div class="cmd-empty">Nothing matches. 🤔</div>'; return; }
  const groups={section:'Go to',thread:'People',action:'Do'};
  let html='',last=null;
  items.forEach((it,i)=>{
    if(it.type!==last){ html+=`<div class="cmd-group">${groups[it.type]}</div>`; last=it.type; }
    const left = it.type==='thread' ? `<div class="av" style="background:${avColor(it.name)}">${initials(it.name)}</div>` : `<span class="emo">${it.emo}</span>`;
    html+=`<div class="cmd-item ${i===0?'sel':''}" data-i="${i}" onclick="runCmd(${i})" onmousemove="cmdHover(${i})">${left}<span>${it.label}</span>${it.sub?`<span class="sub">${it.sub}</span>`:''}</div>`;
  });
  list.innerHTML=html;
}
function cmdHover(i){ cmdSel=i; document.querySelectorAll('.cmd-item').forEach(el=>el.classList.toggle('sel',+el.dataset.i===i)); }
function openCmd(){ document.getElementById('cmdOverlay').classList.add('on'); const inp=document.getElementById('cmdInput'); inp.value=''; renderCmd(); setTimeout(()=>inp.focus(),20); }
function closeCmd(){ document.getElementById('cmdOverlay').classList.remove('on'); }
function cmdKey(e){
  const items=cmdItems();
  if(e.key==='ArrowDown'){ e.preventDefault(); cmdSel=Math.min(items.length-1,cmdSel+1); paintSel(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); cmdSel=Math.max(0,cmdSel-1); paintSel(); }
  else if(e.key==='Enter'){ e.preventDefault(); runCmd(cmdSel); }
  else if(e.key==='Escape'){ closeCmd(); }
}
function paintSel(){ document.querySelectorAll('.cmd-item').forEach(el=>el.classList.toggle('sel',+el.dataset.i===cmdSel)); const s=document.querySelector('.cmd-item.sel'); if(s) s.scrollIntoView({block:'nearest'}); }
function runCmd(i){
  const it=cmdItems()[i]; if(!it) return; closeCmd();
  if(it.type==='section') go(it.id);
  else if(it.type==='thread') openThread(it.id);
  else if(it.id==='copy') copyDraft(state.thread);
  else if(it.id==='export'){ go('exports'); toast('Wrote a daily recap (demo)','📤'); }
}

// ---------- Global keyboard ----------
document.addEventListener('keydown', e=>{
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName);
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCmd(); return; }
  if(document.getElementById('cmdOverlay').classList.contains('on')) return;
  if(typing){ if(e.key==='Escape') document.activeElement.blur(); return; }
  if(e.key==='/'){ e.preventDefault(); if(state.tab!=='inbox') go('inbox'); setTimeout(()=>document.querySelector('.search input')?.focus(),30); }
  else if(e.key==='?'){ toast('⌘K to jump, / to search, 1 2 3 for vibe','⌨️'); }
  else if(state.tab==='inbox' && (e.key==='j'||e.key==='k')){
    const ids=THREADS.filter(t=>state.filter==='all'||(state.filter==='needs'&&t.needs)||(state.filter==='risk'&&t.risk.length)||(state.filter==='emotional'&&t.priority==='emotional')).map(t=>t.id);
    let idx=ids.indexOf(state.thread); idx=e.key==='j'?Math.min(ids.length-1,idx+1):Math.max(0,idx-1); if(ids[idx]) pick(ids[idx]);
  }
  else if(state.tab==='inbox' && ['1','2','3'].includes(e.key)){
    const map={'1':'casual','2':'warm','3':'professional'}; if(TONE_VARIANTS[state.thread]) setTone(state.thread,map[e.key]);
  }
  else if(state.tab==='inbox' && (e.key==='c'||e.key==='C')) copyDraft(state.thread);
});

// ---------- Boot ----------
function applyHashParams(){
  if(!location.hash) return;
  const p=new URLSearchParams(location.hash.slice(1));
  const tab=p.get('tab'), threadId=parseInt(p.get('thread'),10), tone=p.get('tone');
  if(tab) state.tab=tab;
  if(!isNaN(threadId)&&THREADS.some(t=>t.id===threadId)){
    state.thread=threadId; state.inboxPane='detail'; if(!tab) state.tab='inbox';
    if(tone&&TONE_VARIANTS[threadId]&&TONE_VARIANTS[threadId][tone]){ state.tone[threadId]=tone; state.drafts[threadId]=TONE_VARIANTS[threadId][tone]; }
  }
}
applyHashParams();
renderNav(); renderMain();
</script>
</body>
