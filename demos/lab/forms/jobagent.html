  if(abs(v_m.x-u_hover)<0.5)c=mix(c,vec3(1.0,0.94,0.84),0.35);
  float d=length(u_eye-v_w);
  o=vec4(mix(c,${FOG},clamp(1.0-exp(-pow(d*u_fk,2.1)),0.0,0.92)),1.0);}`;

const VS_LINE=`#version 300 es
layout(location=0)in vec3 a_p;uniform mat4 u_vp;out vec3 v_w;
void main(){v_w=a_p;gl_Position=u_vp*vec4(a_p,1.0);}`;
const FS_LINE=`#version 300 es
precision highp float;in vec3 v_w;uniform vec3 u_eye;uniform float u_fk;out vec4 o;
void main(){float d=length(u_eye-v_w);
  o=vec4(vec3(0.30,0.42,0.62)*exp(-pow(d*u_fk,2.1))*0.85,1.0);}`;

const VS_G=`#version 300 es
layout(location=0)in vec2 a_p;uniform mat4 u_vp;out vec3 v_w;
void main(){v_w=vec3(a_p.x,0.,a_p.y);gl_Position=u_vp*vec4(v_w,1.0);}`;
const FS_G=`#version 300 es
precision highp float;in vec3 v_w;uniform vec3 u_eye;uniform float u_fk;out vec4 o;
float grid(vec2 p,float s){vec2 c=p/s;vec2 g=abs(fract(c-0.5)-0.5)/fwidth(c);
  return 1.0-min(min(g.x,g.y),1.0);}
void main(){
  float r=1.0-smoothstep(20.0,150.0,length(v_w.xz));
  vec3 c=vec3(0.022,0.032,0.050)*(0.3+0.7*r);
  c+=vec3(0.070,0.100,0.148)*grid(v_w.xz,8.0)*(0.15+0.85*r);
  c+=vec3(0.125,0.170,0.245)*grid(v_w.xz,40.0)*(0.25+0.75*r);
  float d=length(u_eye-v_w);
  o=vec4(mix(c,vec3(0.052,0.082,0.135),clamp(1.0-exp(-pow(d*u_fk*0.92,2.0)),0.,1.)),1.);}`;

const FS_PICK_LF=`#version 300 es
precision highp float;in vec2 v_uv;in vec3 v_col;in vec2 v_m;in vec3 v_w;out vec4 o;
void main(){if(length(v_uv)>1.0)discard;float i=v_m.x+1.0;
  o=vec4(mod(i,256.)/255.,mod(floor(i/256.),256.)/255.,mod(floor(i/65536.),256.)/255.,1.);}`;
const FS_PICK_BX=`#version 300 es
precision highp float;in vec3 v_w;in vec3 v_n;in vec3 v_col;in vec2 v_m;out vec4 o;
void main(){float i=v_m.x+1.0;
  o=vec4(mod(i,256.)/255.,mod(floor(i/256.),256.)/255.,mod(floor(i/65536.),256.)/255.,1.);}`;

const pBR=prog(VS_BR,FS_BR), pLF=prog(VS_LF,FS_LF), pBX=prog(VS_BX,FS_BX),
      pLN=prog(VS_LINE,FS_LINE), pG=prog(VS_G,FS_G),
      pPL=prog(VS_LF,FS_PICK_LF), pPB=prog(VS_BX,FS_PICK_BX);

/* ---------- buffers ---------- */
const T=D.tree, HX=D.helix;
const nSeg=T.segs.length, nLeaf=T.leaves.length, nBox=HX.items.length;

const sA=new Float32Array(nSeg*3), sB=new Float32Array(nSeg*3), sR=new Float32Array(nSeg*2);
T.segs.forEach((s,i)=>{sA.set(s.a,i*3);sB.set(s.b,i*3);sR.set(s.r,i*2);});
const vaoBR=gl.createVertexArray(); gl.bindVertexArray(vaoBR);
attr(0,buf(new Float32Array(cp)),3); attr(1,buf(new Float32Array(cn)),3);
attr(2,buf(sA),3,1); attr(3,buf(sB),3,1); attr(4,buf(sR),2,1);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,buf(new Uint16Array(ci),gl.ELEMENT_ARRAY_BUFFER));

const lC=new Float32Array(nLeaf*3), lS=new Float32Array(nLeaf), lCol=new Float32Array(nLeaf*3),
      lM=new Float32Array(nLeaf*2);
T.leaves.forEach((l,i)=>{lC.set([l.x,l.y,l.z],i*3);lS[i]=l.s;lCol.set(l.c,i*3);lM.set([i,l.g],i*2);});
const vaoLF=gl.createVertexArray(); gl.bindVertexArray(vaoLF);
attr(0,buf(quad),2); attr(1,buf(lC),3,1); attr(2,buf(lS),1,1); attr(3,buf(lCol),3,1); attr(4,buf(lM),2,1);

const xO=new Float32Array(nBox*3), xS=new Float32Array(nBox*3), xC=new Float32Array(nBox*3),
      xM=new Float32Array(nBox*2);
HX.items.forEach((b,i)=>{xO.set([b.x,b.y,b.z],i*3);xS.set([b.w,b.h,b.w],i*3);
  xC.set(b.c,i*3);xM.set([i,b.g],i*2);});
const vaoBX=gl.createVertexArray(); gl.bindVertexArray(vaoBX);
attr(0,buf(new Float32Array(bp)),3); attr(1,buf(new Float32Array(bn)),3);
attr(2,buf(xO),3,1); attr(3,buf(xS),3,1); attr(4,buf(xC),3,1); attr(5,buf(xM),2,1);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,buf(new Uint16Array(bi),gl.ELEMENT_ARRAY_BUFFER));

const vaoLN=gl.createVertexArray(); gl.bindVertexArray(vaoLN);
attr(0,buf(new Float32Array(HX.ribbon)),3);
const nRib=HX.ribbon.length/3;

const vaoG=gl.createVertexArray(); gl.bindVertexArray(vaoG);
attr(0,buf(new Float32Array([-400,-400,400,-400,400,400,-400,-400,400,400,-400,400])),2);
gl.bindVertexArray(null);

/* ---------- pick target ---------- */
const fbo=gl.createFramebuffer(),ptex=gl.createTexture(),pdep=gl.createRenderbuffer();
let pw=0,ph=0;
function pickSize(w,h){if(w===pw&&h===ph)return;pw=w;ph=h;
 gl.bindTexture(gl.TEXTURE_2D,ptex);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
 gl.bindRenderbuffer(gl.RENDERBUFFER,pdep);
 gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT16,w,h);
 gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
 gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,ptex,0);
 gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,pdep);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);}

/* ---------- state ---------- */
let mode="helix", spin=!RM, W=0,H=0,DPR=1,vp=null,eye=[0,0,0],right=[1,0,0],up=[0,1,0];
let hover=-1, mx=-1,my=-1, needPick=false, lastPick=0, grow=1;
// Frame each form from its own measured bounds, so a 28-file tree and a
// 1026-file tree both arrive fitted instead of one filling the screen and the
// other sitting as a speck.
function fitFor(rad){const tn=Math.tan(0.43),ar=(W||innerWidth)/(H||innerHeight);
  return Math.max(rad/tn, rad/(tn*Math.max(ar,0.35)))*1.15;}
const VIEW={tree:{tx:0,ty:D.tree.cy,tz:0,dist:0,yaw:0.6,pitch:0.22},
            helix:{tx:0,ty:D.helix.cy||24,tz:0,dist:0,yaw:0.7,pitch:0.30}};
let cam=Object.assign({},VIEW.helix);

function resize(){DPR=Math.min(devicePixelRatio||1,2);
 W=Math.floor(innerWidth*DPR);H=Math.floor(innerHeight*DPR);
 cv.width=W;cv.height=H;pickSize(W,H);}
addEventListener("resize",resize);resize();
VIEW.tree.dist=fitFor(D.tree.rad); VIEW.helix.dist=fitFor(D.helix.rad||40);
cam=Object.assign({},VIEW[mode]);

/* ---------- input ---------- */
let drag=null;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);cv.classList.add("drag");
 drag={x:e.clientX,y:e.clientY,pan:e.shiftKey||e.button!==0};spin=false;syncSpin();});
cv.addEventListener("pointermove",e=>{
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(drag.pan){const s=cam.dist*0.0016,sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
   cam.tx-=(dx*cy-dy*sy)*s;cam.tz+=(dx*sy+dy*cy)*s;}
  else{cam.yaw-=dx*0.005;cam.pitch=Math.max(-0.25,Math.min(1.45,cam.pitch+dy*0.004));}}
 mx=e.clientX;my=e.clientY;needPick=true;});
cv.addEventListener("pointerup",()=>{drag=null;cv.classList.remove("drag");});
cv.addEventListener("pointercancel",()=>{drag=null;cv.classList.remove("drag");});
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("wheel",e=>{e.preventDefault();
 cam.dist=Math.max(14,Math.min(700,cam.dist*Math.exp(e.deltaY*0.0011)));},{passive:false});

/* ---------- ui ---------- */
const $=id=>document.getElementById(id), nf=n=>n.toLocaleString("en-US");
$("nm").textContent=D.name;
$("br").textContent=D.branch;
$("st").textContent=nf(D.files)+" files  /  "+nf(D.loc)+" lines";
D.legend.forEach(([n,c])=>{const li=document.createElement("li");
 li.innerHTML="<i></i><span></span>";
 li.querySelector("i").style.background="rgb("+c.map(v=>Math.round(v*255)).join(",")+")";
 li.querySelector("span").textContent=n;$("ll").appendChild(li);});

const NOTE={
 tree:"<b>Tree.</b> Branches are directories, thickness is total lines beneath. Each leaf is one file: size is lines, colour is language, brightness is how often it changes. Single-child directory chains are collapsed into one limb.",
 helix:D.helix.flat
   ? "<b>Helix.</b> Each block is one file. This repo was created in a single burst on "+D.helix.one+", so there is no history to plot: the spiral shows file order, not elapsed time. Height is lines, brightness is how often the file changed since. Try Tree for this one."
   : "<b>Helix.</b> Each block is one file, placed along the spiral by the commit that first added it, oldest at the bottom. Height is lines, brightness is churn. Clusters are bursts of building; gaps are quiet stretches."};
function setMode(m){
  VIEW[mode]=Object.assign({},cam);
  mode=m; cam=Object.assign({},VIEW[m]);
  if(!cam.dist) cam.dist=fitFor((m==="tree"?D.tree.rad:D.helix.rad)||40);
  $("m-tree").setAttribute("aria-pressed",m==="tree");
  $("m-helix").setAttribute("aria-pressed",m==="helix");
  $("note").innerHTML=NOTE[m];
  const ax=$("axis");
  if(m==="helix"&&HX.span[0]){ax.style.opacity=".9";
    ax.textContent=HX.flat?("all files added "+HX.one):(HX.span[0]+"  to  "+HX.span[1]);
    ax.style.left="50%";ax.style.bottom="64px";ax.style.transform="translateX(-50%)";}
  else ax.style.opacity="0";
  hover=-1; $("tip").style.opacity=0;
}
$("m-tree").addEventListener("click",()=>setMode("tree"));
$("m-helix").addEventListener("click",()=>setMode("helix"));
function syncSpin(){$("m-spin").setAttribute("aria-pressed",spin);}
$("m-spin").addEventListener("click",()=>{spin=!spin;syncSpin();});
setMode(mode); syncSpin();

/* ---------- picking ---------- */
function pickAt(cx,cy){
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.viewport(0,0,W,H);gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);gl.disable(gl.BLEND);gl.depthMask(true);
  if(mode==="tree"){
    gl.useProgram(pPL);gl.uniformMatrix4fv(pPL.u.u_vp,false,vp);
    gl.uniform3fv(pPL.u.u_right,right);gl.uniform3fv(pPL.u.u_up,up);
    gl.uniform1f(pPL.u.u_grow,Math.max(grow,0.01));
    gl.bindVertexArray(vaoLF);gl.drawArraysInstanced(gl.TRIANGLES,0,6,nLeaf);
  }else{
    gl.useProgram(pPB);gl.uniformMatrix4fv(pPB.u.u_vp,false,vp);
    gl.bindVertexArray(vaoBX);
    gl.drawElementsInstanced(gl.TRIANGLES,bi.length,gl.UNSIGNED_SHORT,0,nBox);
  }
  const px=new Uint8Array(4);
  const gx=Math.floor(cx*DPR),gy=Math.floor(H-cy*DPR);
  if(gx>=0&&gy>=0&&gx<W&&gy<H)gl.readPixels(gx,gy,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  const id=px[0]+px[1]*256+px[2]*65536-1;
  const n=mode==="tree"?nLeaf:nBox;
  return (id>=0&&id<n)?id:-1;}

const tip=$("tip");
function showTip(id){
  if(id<0){tip.style.opacity=0;return;}
  const o=mode==="tree"?T.leaves[id]:HX.items[id];
  const nm=o.p.split("/").pop();
  tip.innerHTML=nm+" &nbsp;<b>"+(o.l?nf(o.l)+" ln":o.e)+"</b> &nbsp;"+o.k+" commits";
  const flip=mx>innerWidth-260;
  tip.style.transform=flip?"translate(calc(-100% - 12px),-50%)":"translate(12px,-50%)";
  tip.style.left=mx+"px";tip.style.top=my+"px";tip.style.opacity=1;}

/* ---------- frame ---------- */
function frame(t){
  t*=0.001;
  if(spin)cam.yaw+=0.0022;
  const cp2=Math.cos(cam.pitch);
  eye=[cam.tx+cam.dist*cp2*Math.sin(cam.yaw),cam.ty+cam.dist*Math.sin(cam.pitch),
       cam.tz+cam.dist*cp2*Math.cos(cam.yaw)];
  const rad=(mode==="tree"?D.tree.rad:D.helix.rad)||40;
  const FK=0.286/Math.max(rad,8);
  const lk=look(eye,[cam.tx,cam.ty,cam.tz],[0,1,0]);
  right=lk.right; up=lk.up;
  vp=mul(persp(0.86,W/H,0.6,2600),lk.m);

  if(needPick&&t-lastPick>0.05&&!drag){lastPick=t;needPick=false;
    const id=pickAt(mx,my); if(id!==hover){hover=id;showTip(id);} }

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.clearColor(0.051,0.082,0.137,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.disable(gl.BLEND);gl.disable(gl.CULL_FACE);

  gl.useProgram(pG);gl.uniformMatrix4fv(pG.u.u_vp,false,vp);gl.uniform3fv(pG.u.u_eye,eye);gl.uniform1f(pG.u.u_fk,FK);
  gl.bindVertexArray(vaoG);gl.drawArrays(gl.TRIANGLES,0,6);

  if(mode==="tree"){
    gl.enable(gl.CULL_FACE);
    gl.useProgram(pBR);gl.uniformMatrix4fv(pBR.u.u_vp,false,vp);gl.uniform3fv(pBR.u.u_eye,eye);gl.uniform1f(pBR.u.u_fk,FK);
    gl.bindVertexArray(vaoBR);
    gl.drawElementsInstanced(gl.TRIANGLES,ci.length,gl.UNSIGNED_SHORT,0,nSeg);
    gl.disable(gl.CULL_FACE);
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);
    gl.useProgram(pLF);gl.uniformMatrix4fv(pLF.u.u_vp,false,vp);gl.uniform3fv(pLF.u.u_eye,eye);gl.uniform1f(pLF.u.u_fk,FK);
    gl.uniform3fv(pLF.u.u_right,right);gl.uniform3fv(pLF.u.u_up,up);
    gl.uniform1f(pLF.u.u_t,t);gl.uniform1f(pLF.u.u_hover,hover);gl.uniform1f(pLF.u.u_grow,grow);
    gl.bindVertexArray(vaoLF);gl.drawArraysInstanced(gl.TRIANGLES,0,6,nLeaf);
    gl.depthMask(true);gl.disable(gl.BLEND);
  }else{
    gl.useProgram(pLN);gl.uniformMatrix4fv(pLN.u.u_vp,false,vp);gl.uniform3fv(pLN.u.u_eye,eye);gl.uniform1f(pLN.u.u_fk,FK);
    gl.bindVertexArray(vaoLN);gl.drawArrays(gl.LINE_STRIP,0,nRib);
    gl.enable(gl.CULL_FACE);
    gl.useProgram(pBX);gl.uniformMatrix4fv(pBX.u.u_vp,false,vp);gl.uniform3fv(pBX.u.u_eye,eye);gl.uniform1f(pBX.u.u_fk,FK);
    gl.uniform1f(pBX.u.u_t,t);gl.uniform1f(pBX.u.u_hover,hover);
    gl.bindVertexArray(vaoBX);
    gl.drawElementsInstanced(gl.TRIANGLES,bi.length,gl.UNSIGNED_SHORT,0,nBox);
    gl.disable(gl.CULL_FACE);
  }
  gl.bindVertexArray(null);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
